[flake8]
ignore = ANN101, ANN001, ANN201, ANN204, VNE003, E231, Q000, W292, W293, E501, F401, ANN401
max-line-length = 119
exclude = .venv,venv,dist,build,__pycache__
per-file-ignores =
    src/tests/*: ANN001, ANN201, ANN101, F811
    src/main.py: ANN201
    src/api/v1/theater.py: ANN201
    src/database/models.py: VNE003, ANN204
    src/database/populate.py: ANN204
    src/database/session.py: E231
    src/routes/movies.py: ANN201
    src/schemas/movies.py: VNE003
